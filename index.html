<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="rps-container">
        <div class="result-container">
            <div class="score-card">
                <div class="score" id="human-score">0</div>
                <div class="choice-card" id="human-choice"></div>
                <div>Human</div>
            </div>
            <div class="rps-message"></div>
            <div class="score-card">
                <div class="score" id="computer-score">0</div>
                <div class="choice-card" id="computer-choice"></div>
                <div>Computer</div>
            </div>
        </div>
        <div class="choices">
            <button class="choice-btn" id="rock">Rock</button>
            <button class="choice-btn" id="paper">Paper</button>
            <button class="choice-btn" id="scissors">Scissors</button>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
